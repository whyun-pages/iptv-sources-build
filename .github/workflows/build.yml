name: Build IPTV sources
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy validated output (also requires DEPLOY_ENABLED=true)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: iptv-sources-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test artifact validator
        run: node --test scripts/validate-output.test.mjs
      - uses: actions/checkout@v4
        with:
          repository: whyun-pages/iptv-sources
          ref: main
          path: source
          persist-credentials: false
      - name: Record source revision
        id: source
        working-directory: source
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Source: whyun-pages/iptv-sources@$sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
          run_install: false
      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Compile
        working-directory: source
        run: pnpm build
      - name: Generate output
        working-directory: source
        env:
          CLOSE_SOURCE_PROXY: 'true'
          CUSTOM_URL: ${{ vars.CUSTOM_URL }}
          IPTV_PROXY_IP_RANGES: ${{ vars.IPTV_PROXY_IP_RANGES }}
          IPTV_PROXY_PORT: ${{ vars.IPTV_PROXY_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf m3u
          pnpm m3u 2>&1 | tee ../build.log
          pnpm static
      - name: Validate before publishing
        run: node scripts/validate-output.mjs source/m3u | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pages-output
          path: source/m3u/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Deployment status
        if: vars.DEPLOY_ENABLED != 'true' || (github.event_name == 'workflow_dispatch' && !inputs.deploy)
        run: echo 'Build only. Deployment is disabled or was not requested.' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: pages-output
          path: output
      - name: Verify existing target and publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME || secrets.PROJECT_NAME }}
          CF_PAGES_BRANCH: ${{ vars.CF_PAGES_BRANCH }}
          CUSTOM_URL: ${{ vars.CUSTOM_URL }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          CI: 'true'
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PROJECT_NAME CF_PAGES_BRANCH CUSTOM_URL; do
            if [ -z "${!key}" ]; then echo "::error::Missing configuration: $key"; exit 1; fi
          done
          # GET only: refuse nonexistent projects or an incorrect production branch.
          node --input-type=module <<'JS'
          const { CLOUDFLARE_ACCOUNT_ID: account, PROJECT_NAME: project, CLOUDFLARE_API_TOKEN: token, CF_PAGES_BRANCH: branch, CUSTOM_URL: url } = process.env;
          if (new URL(url).protocol !== 'https:') throw new Error('CUSTOM_URL must be HTTPS');
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/pages/projects/${encodeURIComponent(project)}`, { headers: { Authorization: `Bearer ${token}` } });
          const data = await response.json();
          if (!response.ok || !data.success) throw new Error('Cannot verify existing Pages project; check account, project and token');
          if (data.result.production_branch !== branch) throw new Error('CF_PAGES_BRANCH does not match the existing production branch');
          if (!(data.result.domains || []).includes(new URL(url).hostname)) throw new Error('CUSTOM_URL is not a domain of the existing Pages project');
          JS
          npx --yes wrangler@4 pages deploy output --project-name="$PROJECT_NAME" --branch="$CF_PAGES_BRANCH" --commit-hash="$SOURCE_SHA" 2>&1 | tee deployment.log
          cat deployment.log >> "$GITHUB_STEP_SUMMARY"
